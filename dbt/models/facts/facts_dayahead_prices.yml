version: 2

models:
  - name: facts_dayahead_prices
    description: "Fact table containing hourly electricity prices with derived date attributes."

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - hour_of_day

    columns:
      - name: date
        tests:
          - not_null

      - name: hour_of_day
        tests:
          - not_null

      - name: france
        tests:
          - not_null

      - name: germany
        tests:
          - not_null

      - name: italy
        tests:
          - not_null

      - name: belgium
        tests:
          - not_null

      - name: spain
        tests:
          - not_null

      - name: uk
        tests:
          - not_null
