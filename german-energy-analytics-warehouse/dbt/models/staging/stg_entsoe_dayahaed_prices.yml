version: 2

models:
  - name: stg_entsoe_dayahead_prices
    description: "Cleaned and enriched ENTENSO-E day-ahead price data with derived data fields"
    columns:
    - name: date
      tests:
       - not_null
    - name: hour_of_day
      tests:
        - not_null
    - name: year
      tests:
        - not_null
    - name: month
      tests:
       - not_null
    - name: day
      tests:
       - not_null
    - name: weekday
      tests:
      - not_null