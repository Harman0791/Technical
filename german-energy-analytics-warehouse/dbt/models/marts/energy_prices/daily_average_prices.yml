version: 2

models:
  - name: daily_average_prices
    description: "Daily average electricity prices per country"

    columns:
      - name: date
        tests:
          - not_null
          - unique
      - name: avg_france
        tests:
          - not_null
      - name: avg_germany
        tests:
          - not_null
      - name: avg_belgium
        tests:
          - not_null
      - name: avg_italy
        tests:
          - not_null
      - name: avg_spain
        tests:
          - not_null
      - name: avg_uk
        tests:
         - not_null
